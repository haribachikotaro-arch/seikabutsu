<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#d8dfe4"/><style>text{font-family:'Yu Gothic',Meiryo,sans-serif}</style><text x="57" y="65" font-size="17" fill="#697c88" letter-spacing="2">みんなで決める投票箱</text><path d="M65 115v510h870" fill="none" stroke="#becbd4"/><g transform="translate(174 132) rotate(-2 325 220)"><rect x="7" y="10" width="650" height="435" fill="#b7c5ce"/><rect width="650" height="435" rx="3" fill="#fafcfb"/><text x="32" y="42" font-size="15" fill="#455d6b" font-weight="700">みんなの投票箱</text><text x="501" y="42" font-size="11" fill="#8295a0">回答受付中</text><path d="M0 62h650" stroke="#d8d9cb"/><text x="56" y="120" font-size="22" font-weight="700" fill="#364e5d">次の勉強会、何をやってみたい？</text><text x="56" y="152" font-size="12" fill="#8495a0">気になるテーマをひとつ選んでください。</text><rect x="54" y="177" width="540" height="45" rx="2" fill="#e5eef2" stroke="#7f9ead"/><circle cx="77" cy="199" r="7" fill="#5b8092" stroke="#a2b4bd"/><text x="99" y="204" font-size="13" fill="#536d7b">Webサイトをつくる</text><rect x="54" y="235" width="540" height="45" rx="2" fill="#fff" stroke="#dae2e5"/><circle cx="77" cy="257" r="7" fill="#fff" stroke="#a2b4bd"/><text x="99" y="262" font-size="13" fill="#536d7b">ゲームをつくる</text><rect x="54" y="293" width="540" height="45" rx="2" fill="#fff" stroke="#dae2e5"/><circle cx="77" cy="315" r="7" fill="#fff" stroke="#a2b4bd"/><text x="99" y="320" font-size="13" fill="#536d7b">データを見てみる</text><rect x="442" y="364" width="151" height="35" rx="2" fill="#577888"/><text x="518" y="387" text-anchor="middle" font-size="12" fill="white">このテーマに投票 →</text></g><text x="810" y="672" font-size="13" fill="#798e9b">制作サンプル</text></svg>