<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いま、どこで作業する？ | DataDreamers サンプル</title><style>body{font-family:Meiryo,sans-serif;background:#f8f7ef;color:#3c4336;padding:25px;margin:0}h1{font-size:21px}p{font-size:12px;color:#747b6d;line-height:1.9}button,select{font:inherit;padding:11px 18px;background:#637653;color:white;border:0;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #b75e36}button:disabled{opacity:.5}.note{font-size:10px;border-top:1px solid #daddcc;padding-top:15px;margin-top:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.room{border:1px solid #cad3bc;padding:18px;background:#e5ebdc;font-size:13px}.room span{display:block;font-size:11px;margin-top:12px;color:#647651}</style><h1>いま、どこで作業する？</h1><p>施設の種類で絞り込めます。</p><label>表示する施設 <select id="filter"><option value="all">すべて</option><option value="study">自習スペース</option><option value="room">教室</option></select></label><div class="grid"><div class="room" data-kind="study">図書室<span>○ 空いています</span></div><div class="room" data-kind="study">自習室 A<span>△ やや混雑</span></div><div class="room" data-kind="study">ラウンジ<span>○ 空いています</span></div><div class="room" data-kind="room">第2教室<span>― 情報なし</span></div></div><p class="note">DataDreamers / 動作確認用サンプル。実際の施設情報や投票結果ではありません。</p><script>document.querySelector("#filter").onchange=e=>document.querySelectorAll(".room").forEach(r=>r.hidden=e.target.value!=="all"&&r.dataset.kind!==e.target.value);</script></html>
