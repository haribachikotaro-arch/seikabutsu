<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひと区切り。 | DataDreamers サンプル</title><style>body{font-family:Meiryo,sans-serif;background:#f8f7ef;color:#3c4336;padding:25px;margin:0}h1{font-size:21px}p{font-size:12px;color:#747b6d;line-height:1.9}button,select{font:inherit;padding:11px 18px;background:#637653;color:white;border:0;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #b75e36}button:disabled{opacity:.5}.note{font-size:10px;border-top:1px solid #daddcc;padding-top:15px;margin-top:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.room{border:1px solid #cad3bc;padding:18px;background:#e5ebdc;font-size:13px}.room span{display:block;font-size:11px;margin-top:12px;color:#647651}</style><h1>ひと区切り。</h1><p>25分だけ、目の前のことに集中しよう。</p><div id="time" role="timer" style="font-size:70px;text-align:center;padding:25px;font-variant-numeric:tabular-nums">25:00</div><div style="text-align:center"><button id="start">はじめる</button><button id="reset">リセット</button></div><p class="note">DataDreamers / 動作確認用サンプル。実際の施設情報や投票結果ではありません。</p><script>let left=1500,timer=null;const s=document.querySelector("#start"),t=document.querySelector("#time");function paint(){t.textContent=Math.floor(left/60).toString().padStart(2,"0")+":"+(left%60).toString().padStart(2,"0")}s.onclick=()=>{if(timer){clearInterval(timer);timer=null;s.textContent="再開する"}else{s.textContent="一時停止";timer=setInterval(()=>{left--;paint();if(left<=0){clearInterval(timer);timer=null;s.textContent="完了";s.disabled=true}},1000)}};document.querySelector("#reset").onclick=()=>{clearInterval(timer);timer=null;left=1500;paint();s.disabled=false;s.textContent="はじめる"};</script></html>
