<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>次の勉強会、何をやってみたい？ | DataDreamers サンプル</title><style>body{font-family:Meiryo,sans-serif;background:#f8f7ef;color:#3c4336;padding:25px;margin:0}h1{font-size:21px}p{font-size:12px;color:#747b6d;line-height:1.9}button,select{font:inherit;padding:11px 18px;background:#637653;color:white;border:0;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid #b75e36}button:disabled{opacity:.5}.note{font-size:10px;border-top:1px solid #daddcc;padding-top:15px;margin-top:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.room{border:1px solid #cad3bc;padding:18px;background:#e5ebdc;font-size:13px}.room span{display:block;font-size:11px;margin-top:12px;color:#647651}</style><h1>次の勉強会、何をやってみたい？</h1><p>気になるテーマをひとつ選んでください。</p><form id="vote"><p><label><input type="radio" name="theme" value="Webサイトをつくる" required> Webサイトをつくる</label></p><p><label><input type="radio" name="theme" value="ゲームをつくる" required> ゲームをつくる</label></p><p><label><input type="radio" name="theme" value="データを見てみる" required> データを見てみる</label></p><button>このテーマに投票 →</button></form><p id="result" role="status"></p><p class="note">DataDreamers / 動作確認用サンプル。実際の施設情報や投票結果ではありません。</p><script>document.querySelector("#vote").onsubmit=e=>{e.preventDefault();document.querySelector("#result").textContent="「"+new FormData(e.target).get("theme")+"」を選びました。このサンプルでは回答は送信されません。"};</script></html>
